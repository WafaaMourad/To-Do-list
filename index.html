<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="md:col-10 m-auto">
                <h3 class="text-center">My To Do List</h3>
                <form id="myForm">
                    <input type="text" name="works" id="works"placeholder="Enter Your Works"class="form-control my-5">
                    <input type="submit" value="Enter"class="btn-solid theme-accent form-control">
                </form>
                <ul id="result"></ul>
                
                <template id="taskTemplate">
                    <li class="d-flex justify-content-between my-4">
                        <span></span>
                        <button type="button" class="btn-subtle theme-success">
                            Done
                        </button>
                    </li>
                </template>

            </div>
        </div>
    </div>

    <script src="js/main.js"></script>

</body>
</html>
